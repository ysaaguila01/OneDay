name: Generate Gallery JSON

on:
  push:
    branches:
      - main
    paths:
      - "assets/images/gallery/**"
      - ".github/workflows/gallery.yml"

permissions:
  contents: write

jobs:
  generate-gallery:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate gallery.json
        run: |
          mkdir -p assets

          echo "[" > assets/gallery.json

          first=true

          find assets/images/gallery -maxdepth 1 -type f \
            \( -iname "*.jpg" -o -iname "*.jpeg" -o -iname "*.png" -o -iname "*.webp" -o -iname "*.gif" -o -iname "*.heic" \) \
            | sort | while read file
          do
            if [ "$first" = true ]; then
              first=false
            else
              echo "," >> assets/gallery.json
            fi

            echo "  \"$file\"" >> assets/gallery.json
          done

          echo "]" >> assets/gallery.json

      - name: Commit gallery.json
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add assets/gallery.json

          # Skip if nothing changed
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Auto update gallery"

          # Sync with latest main before pushing
          git pull --rebase origin main

          git push
